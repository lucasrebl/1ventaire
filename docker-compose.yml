services:
  app:
    build: .
    container_name: 1ventaire_app
    ports:
      - "0.0.0.0:8080:9000"  # Écouter sur toutes les interfaces
    volumes:
      - .:/app
    depends_on:
      - database
    environment:
      # Configuration pour que Symfony écoute sur toutes les interfaces
      APP_RUNTIME_ENV: "0.0.0.0"

  database:
    image: mysql:8.0.32
    container_name: 1ventaire_mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1ventaire_root_password
      MYSQL_DATABASE: 1ventaire_db
      MYSQL_USER: 1ventaire_user
      MYSQL_PASSWORD: 1ventaire_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  nginx:
    image: nginx:latest
    container_name: 1ventaire_nginx
    ports:
      - "0.0.0.0:8000:80"  # Écouter sur toutes les interfaces
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./snippets:/etc/nginx/snippets:ro 
      - .:/app
    depends_on:
      - app

volumes:
  db_data:
